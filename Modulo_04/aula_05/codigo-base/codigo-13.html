<div class="carousel-indicators">
  <button type="button" data-bs-target="#depoimentos"
    data-bs-slide-to="0" class="active" aria-current="true"
    aria-label="Depoimento de Ana"></button>
  <button type="button" data-bs-target="#depoimentos"
    data-bs-slide-to="1" aria-label="Depoimento de João"></button>
</div>
<button class="carousel-control-prev" type="button"
  data-bs-target="#depoimentos" data-bs-slide="prev">
  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  <span class="visually-hidden">Depoimento anterior</span>
</button>
<button class="carousel-control-next" type="button"
  data-bs-target="#depoimentos" data-bs-slide="next">
  <span class="carousel-control-next-icon" aria-hidden="true"></span>
  <span class="visually-hidden">Próximo depoimento</span>
</button>
