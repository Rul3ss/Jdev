<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Loja de Bolo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="container py-2">

        <!-- Cabeçalho -->
        <header class="text-center py-2">
            <h1 class="display-6 fw-bold">
                Loja de Bolo
            </h1>
        </header>

        <!-- Navegação -->
        <nav class="navbar justify-content-center">
            <div class="navbar-nav flex-row gap-4">

                <a href="index.html" class="nav-link">
                    Home
                </a>

                <a href="contato.html" class="nav-link active text-decoration-underline">
                    Contato
                </a>

                <a href="sobre.html" class="nav-link">
                    Sobre
                </a>

            </div>
        </nav>

        <!-- Conteúdo -->
        <main class="flex-grow-1">

            <section class="py-5">

                <h2 class="text-center mb-4">
                    Entre em contato
                </h2>

                <p class="text-center mb-5">
                    Preencha o formulário abaixo para entrar em contato
                    conosco.
                </p>

                <div class="row justify-content-center">

                    <div class="col-12 col-md-8 col-lg-6">

                        <form>

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome
                                </label>

                                <input type="text" class="form-control" id="nome" placeholder="Digite seu nome"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    E-mail
                                </label>

                                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="mensagem" class="form-label">
                                    Mensagem
                                </label>

                                <textarea class="form-control" id="mensagem" rows="5" placeholder="Digite sua mensagem"
                                    required></textarea>
                            </div>

                            <button type="submit" class="btn btn-dark">
                                Enviar mensagem
                            </button>

                        </form>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Rodapé -->
    <footer class="bg-dark text-white py-3">

        <div class="container">

            <div class="row">

                <!-- Coluna 1 -->
                <div class="col-12 col-md-3">

                    <h4>Loja de Bolo</h4>

                    <p>
                        Bolos deliciosos feitos com carinho para todos
                        os momentos.
                    </p>

                </div>

                <!-- Coluna 2 -->
                <div class="col-12 col-md-3">

                    <h4>Navegação</h4>

                    <nav class="nav flex-column">

                        <a href="index.html" class="nav-link text-white">
                            Home
                        </a>

                        <a href="contato.html" class="nav-link active text-decoration-underline">
                            Contato
                        </a>

                        <a href="sobre.html" class="nav-link text-white">
                            Sobre
                        </a>

                    </nav>

                </div>

                <!-- Coluna 3 -->
                <div class="col-12 col-md-3">

                    <h4>Redes Sociais</h4>

                    <a href="#" class="text-white me-3">
                        <i class="bi bi-instagram fs-4"></i>
                    </a>

                    <a href="#" class="text-white me-3">
                        <i class="bi bi-facebook fs-4"></i>
                    </a>

                    <a href="#" class="text-white">
                        <i class="bi bi-tiktok fs-4"></i>
                    </a>

                </div>

                <!-- Coluna 4 -->
                <div class="col-12 col-md-3">

                    <h4>Loja de Bolo</h4>

                    <p>© 2026 Loja de Bolo</p>

                    <p>Todos os direitos reservados.</p>

                </div>

            </div>

        </div>

    </footer>

</body>

</html>
