<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Meu portfólio</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

  <main class="container py-4">

    <!-- Botão para abrir o modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#detalhes">
      Ver detalhes
    </button>


    <!-- Modal -->
    <div class="modal fade" id="detalhes" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">

          <!-- Cabeçalho -->
          <div class="modal-header">
            <h2 id="tituloModal" class="modal-title fs-5">
              Conecta
            </h2>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>

          <!-- Corpo -->
          <div class="modal-body">
            <p>
              Protótipo de uma vitrine de oportunidades.
            </p>
          </div>

          <!-- Rodapé -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Fechar
            </button>
          </div>

        </div>
      </div>
    </div>


    <button id="salvar" type="button" class="btn btn-success">
      <i class="bi bi-bookmark" aria-hidden="true"></i>
      Salvar projeto
    </button>



    <!-- Estado do projeto -->
    <p id="estadoSalvo" class="mt-4">
      Projeto ainda não salvo nesta demonstração.
    </p>


    <!-- Toast -->
    <div aria-live="polite" aria-atomic="true" class="position-relative">
      <div id="avisoSalvo" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-body">
          Projeto marcado como salvo nesta sessão.
        </div>
      </div>
    </div>

  </main>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Seu JavaScript -->
  <script src="app.js"></script>

</body>

</html>
